name = "dealhunt"
main = "worker/worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/report", "/api/cs", "/api/gamepage", "/api/steamc", "/api/country"]

[[kv_namespaces]]
binding = "KV"
id = "85eb169c3d9c49f88de56dd97d7674f9"

[triggers]
crons = ["*/30 * * * *", "37 1,7,13,19 * * *", "47 4,16 * * *", "12 */3 * * *"]

[vars]
CRON_DEEP = "37 1,7,13,19 * * *"
CRON_COUNTRY = "47 4,16 * * *"
CRON_STEAM = "12 */3 * * *"
