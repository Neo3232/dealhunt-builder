name: refresh
on:
  workflow_dispatch:
    inputs:
      job:
        description: feed, deep, country or steam
        default: feed
  schedule:
    - cron: '17 */6 * * *'
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_KV_ID: ${{ secrets.CF_KV_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      STATE_DIR: state
      JOB: ${{ github.event.inputs.job || 'feed' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore saved state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-none
          restore-keys: state-
      - name: Refresh data
        run: |
          case "$JOB" in
            feed) node builder/feed.js; node builder/offers.js ;;
            *) node builder/$JOB.js ;;
          esac
      - name: Write static files
        run: node builder/export.js
      - name: Save state
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish
        run: npx -y wrangler@4 deploy
