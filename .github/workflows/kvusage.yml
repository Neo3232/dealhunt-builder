name: kvusage
on: workflow_dispatch
jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - name: KV operations by type (counts only)
        env:
          T: ${{ secrets.CF_API_TOKEN }}
          A: ${{ secrets.CF_ACCOUNT_ID }}
          N: ${{ secrets.CF_KV_ID }}
        run: |
          for D in $(date -u +%F) $(date -u -d yesterday +%F); do
          echo "== $D (UTC)"
          Q=$(jq -n --arg a "$A" --arg d "$D" '{query:"query($a:String!,$s:Date!,$e:Date!){viewer{accounts(filter:{accountTag:$a}){kvOperationsAdaptiveGroups(limit:50,filter:{date_geq:$s,date_leq:$e}){sum{requests} dimensions{actionType namespaceId}}}}}",variables:{a:$a,s:$d,e:$d}}')
          curl -s https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d "$Q" | jq -c '.errors, (.data.viewer.accounts[0].kvOperationsAdaptiveGroups // [] | map({a:.dimensions.actionType,n:.sum.requests}))'
          done
