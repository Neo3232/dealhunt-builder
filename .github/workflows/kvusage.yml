name: kvusage
on: workflow_dispatch
jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - name: KV operations by hour and type (counts only)
        env:
          T: ${{ secrets.CF_API_TOKEN }}
          A: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          S=$(date -u -d '30 hours ago' +%FT%TZ); E=$(date -u +%FT%TZ); echo "now $E"
          Q=$(jq -n --arg a "$A" --arg s "$S" --arg e "$E" '{query:"query($a:String!,$s:Time!,$e:Time!){viewer{accounts(filter:{accountTag:$a}){kvOperationsAdaptiveGroups(limit:1000,orderBy:[datetimeHour_ASC],filter:{datetime_geq:$s,datetime_leq:$e}){sum{requests} dimensions{actionType datetimeHour}}}}}",variables:{a:$a,s:$s,e:$e}}')
          curl -s https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d "$Q" | jq -r '.errors, (.data.viewer.accounts[0].kvOperationsAdaptiveGroups // [] | .[] | "\(.dimensions.datetimeHour) \(.dimensions.actionType) \(.sum.requests)")'
